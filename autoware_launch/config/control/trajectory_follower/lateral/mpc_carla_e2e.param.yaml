/**:
  ros__parameters:
    # -- system --
    traj_resample_dist: 0.1
    use_steer_prediction: false
    use_delayed_initial_state: true

    # -- path smoothing --
    enable_path_smoothing: false
    path_filter_moving_ave_num: 25
    curvature_smoothing_num_traj: 15
    curvature_smoothing_num_ref_steer: 15

    # -- trajectory extending --
    extend_trajectory_for_end_yaw_control: false

    # -- mpc optimization --
    qp_solver_type: "osqp"
    mpc_prediction_horizon: 60
    mpc_prediction_dt: 0.08
    mpc_weight_lat_error: 2.0
    mpc_weight_heading_error: 0.2
    mpc_weight_heading_error_squared_vel: 0.6
    mpc_weight_steering_input: 0.35
    mpc_weight_steering_input_squared_vel: 0.05
    mpc_weight_lat_jerk: 0.05
    mpc_weight_steer_rate: 0.01
    mpc_weight_steer_acc: 0.000001
    mpc_low_curvature_weight_lat_error: 0.5
    mpc_low_curvature_weight_heading_error: 0.05
    mpc_low_curvature_weight_heading_error_squared_vel: 0.3
    mpc_low_curvature_weight_steering_input: 0.5
    mpc_low_curvature_weight_steering_input_squared_vel: 0.05
    mpc_low_curvature_weight_lat_jerk: 0.0
    mpc_low_curvature_weight_steer_rate: 0.01
    mpc_low_curvature_weight_steer_acc: 0.000001
    mpc_low_curvature_thresh_curvature: 0.01
    mpc_weight_terminal_lat_error: 2.0
    mpc_weight_terminal_heading_error: 0.5
    mpc_zero_ff_steer_deg: 0.2
    mpc_acceleration_limit: 2.0
    mpc_velocity_time_constant: 0.3
    mpc_min_prediction_length: 5.0

    # -- vehicle model --
    vehicle_model_type: "kinematics"
    input_delay: 0.15
    vehicle_model_steer_tau: 0.15
    steer_rate_lim_dps_list_by_curvature: [80.0, 100.0, 120.0]
    curvature_list_for_steer_rate_lim: [0.001, 0.002, 0.01]
    steer_rate_lim_dps_list_by_velocity: [100.0, 80.0, 60.0]
    velocity_list_for_steer_rate_lim: [10.0, 15.0, 20.0]
    acceleration_limit: 2.0
    velocity_time_constant: 0.3

    # -- lowpass filter for noise reduction --
    steering_lpf_cutoff_hz: 5.0
    error_deriv_lpf_cutoff_hz: 5.0

    # stop state: steering command is kept in the previous value in the stop state.
    stop_state_entry_ego_speed: 0.001
    stop_state_entry_target_speed: 0.001
    converged_steer_rad: 0.1
    keep_steer_control_until_converged: true
    new_traj_duration_time: 1.0
    new_traj_end_dist: 0.3
    mpc_converged_threshold_rps: 0.01

    # steer offset
    steering_offset:
      enable_auto_steering_offset_removal: true
      steer_offset_filter_cutoff_hz: 0.3
      max_update_th: 0.01

    publish_debug_trajectories: true
