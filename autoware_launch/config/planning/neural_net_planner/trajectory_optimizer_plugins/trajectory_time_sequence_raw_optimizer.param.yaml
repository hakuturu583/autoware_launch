/**:
  ros__parameters:
    # Vehicle-tuned weights from X2 (autoware_launch.x2#2831 / #2869).
    # The plugin stays off until use_time_sequence_raw_optimizer is true.
    #
    # Enabling requires this companion set together:
    # 1. use_time_sequence_raw_optimizer: true
    # 2. diffusion / e2e planner velocity_smoothing_window: 1 (default 8)
    # 3. trajectory_velocity_optimizer set_engage_speed: true, target_pull_out_acc_mps2: 0.2
    # 4. MPC keep_steer_control_until_converged: false,
    #    stop_state_steer_hold_duration: 9999.0, enable_confidence_steer_slew_limit: false
    time_sequence_raw_optimizer:
      weight_longitudinal: 0.5
      weight_lateral: 0.5
      weight_yaw: 0.05
      weight_jerk: 0.03
      weight_steering_rate: 0.10
      terminal_weight_scale: 1.0
      min_velocity_mps: 0.0
      max_velocity_mps: 30.0
      min_acceleration_mps2: -4.0
      max_acceleration_mps2: 1.5
      min_jerk_mps3: -5.0
      max_jerk_mps3: 5.0
      max_steering_rate_rps: 2.0
      max_lateral_acceleration_mps2: 3.0
      max_sqp_iterations: 50
      publish_debug_topics: true
      # Seed OCP x0 from odom at candidate stamp, not latest 40 Hz pose.
      use_stamped_ego_state: true
      ego_state_buffer_duration_s: 1.0
      max_ego_stamp_mismatch_s: 0.15

      stopped_velocity_threshold_mps: 0.15
      stopped_trajectory_max_length_m: 1.5
      goal_steer_zero_enable: true
      goal_steer_zero_distance_m: 5.0
      goal_steer_zero_requires_stopped: true

    road_border_avoidance:
      enable: true
      footprint_margin_m: 0.3
      search_radius_m: 120.0
      shift_step_m: 0.02  # first 3 probes [m]; remaining clearance via bisection
      max_lateral_shift_m: 1.5
      propagate_shift: true
