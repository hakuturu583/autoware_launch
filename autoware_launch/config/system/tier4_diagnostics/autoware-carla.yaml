# CARLA Simulator Specific Diagnostic Configuration (minimal)
#
# The original xx1 graph referenced a whole /autoware/<module>/<mode> tree and
# NDT-based localization diags (ndt_scan_matcher) that do not exist in this
# CARLA + ground-truth-localization + ResWorld setup, so the aggregator aborted
# with PathNotFound. For a simulation closed-loop there is no real hardware
# health to gate on, so every operation mode is declared always-available. This
# lets /system/operation_mode/availability come up so the ego can be engaged.
units:
  - { path: /autoware/modes/local, type: and }
  - { path: /autoware/modes/remote, type: and }
  - { path: /autoware/modes/stop, type: and }
  - { path: /autoware/modes/autonomous, type: and }
  - { path: /autoware/modes/pull_over, type: and }
  - { path: /autoware/modes/comfortable_stop, type: and }
  - { path: /autoware/modes/emergency_stop, type: and }
