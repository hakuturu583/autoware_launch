name: Check upstream for cherry-pick

on:
  schedule:
    - cron: 0 * * * * # Every hour at :00 minutes UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  UPSTREAM_OWNER: tier4
  UPSTREAM_REPO: autoware_launch.x2
  UPSTREAM_BRANCH: tier4/main
  UPSTREAM_PR_LABEL: xx1 tier4/main
  TARGET_BRANCH: tier4/main
  PR_LABEL: cherry-pick from x2

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate token
        id: generate-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git config
        uses: autowarefoundation/autoware-github-actions/set-git-config@v1
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Create required labels if they don't exist
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const label = {
              name: '${{ env.PR_LABEL }}',
              color: 'FFA500',
              description: 'PR generated to cherry-pick from autoware_launch.x2'
            };

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label.name
              });
              console.log(`Label ${label.name} already exists`);
            } catch (error) {
              if (error.status === 404) {
                console.log(`Label ${label.name} does not exist. Creating it...`);
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
                console.log(`Label ${label.name} created successfully`);
              } else {
                throw error;
              }
            }

      - name: Discover upstream cherry-pick candidates
        uses: actions/github-script@v7
        id: discover
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const fs = require('fs');
            const upstreamOwner = '${{ env.UPSTREAM_OWNER }}';
            const upstreamRepo = '${{ env.UPSTREAM_REPO }}';
            const upstreamBranch = '${{ env.UPSTREAM_BRANCH }}';
            const upstreamPRLabel = '${{ env.UPSTREAM_PR_LABEL }}';
            const now = new Date();
            const cutoffTime = new Date(now.getTime() - (42 * 24 * 60 * 60 * 1000));
            const cutoffDate = cutoffTime.toISOString().split('T')[0];
            const upstreamRef = `${upstreamOwner}/${upstreamRepo}`;

            console.log(`Fetching merged PRs from ${upstreamRef} with query merged:>=${cutoffDate}, base:${upstreamBranch}, and label:"${upstreamPRLabel}"`);

            const upstreamPRs = [];
            let page = 1;
            const perPage = 100;
            const query = `repo:${upstreamRef} is:pr is:merged base:${upstreamBranch} label:"${upstreamPRLabel}" merged:>=${cutoffDate}`;

            while (true) {
              const response = await github.rest.search.issuesAndPullRequests({
                q: query,
                per_page: perPage,
                page: page
              });

              if (response.data.items.length === 0) break;

              for (const prItem of response.data.items) {
                const prDetail = await github.rest.pulls.get({
                  owner: upstreamOwner,
                  repo: upstreamRepo,
                  pull_number: prItem.number
                });

                upstreamPRs.push({
                  number: prDetail.data.number,
                  title: prDetail.data.title
                });
              }

              if (response.data.items.length < perPage) break;
              page++;
            }

            console.log(`Found ${upstreamPRs.length} upstream PRs merged since ${cutoffDate}`);

            const outputPath = `${process.env.RUNNER_TEMP}/upstream-prs.json`;
            fs.writeFileSync(outputPath, JSON.stringify(upstreamPRs, null, 2));
            core.setOutput('count', String(upstreamPRs.length));

      - name: Create draft cherry-pick PRs
        if: steps.discover.outputs.count != '0'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -uo pipefail

          # Copy scripts to RUNNER_TEMP before any git checkout. Each cherry-pick
          # branch is based on tier4/main, which may not yet contain these files
          # while the workflow is still under development.
          script_dir="${RUNNER_TEMP}/check-upstream-scripts"
          rm -rf "${script_dir}"
          cp -a "${GITHUB_WORKSPACE}/.github/workflows/scripts/check-upstream/." "${script_dir}/"
          chmod +x "${script_dir}"/*.sh
          script="${script_dir}/create-cherry-pick-draft.sh"

          list="${RUNNER_TEMP}/upstream-prs.json"
          if [[ ! -f "$list" ]]; then
            echo "No upstream PR list found at ${list}; nothing to process."
            exit 0
          fi

          created=0
          skipped=0
          failed=0

          while IFS= read -r upstream_pr; do
            [[ -n "$upstream_pr" ]] || continue
            echo "Processing upstream PR #${upstream_pr}..."

            set +e
            result="$("$script" --upstream-pr "$upstream_pr" 2>&1)"
            status=$?
            set -e

            echo "$result"

            if [[ $status -eq 0 ]]; then
              created=$((created + 1))
            elif [[ $status -eq 2 ]]; then
              skipped=$((skipped + 1))
            else
              failed=$((failed + 1))
              echo "error: failed to bootstrap cherry-pick for upstream #${upstream_pr}" >&2
            fi
          done < <(jq -r '.[].number' "$list")

          echo "Summary: created=${created}, skipped=${skipped}, failed=${failed}"

          if [[ $failed -gt 0 ]]; then
            exit 1
          fi
